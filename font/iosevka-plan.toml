# Build plan for the Iosevka base of Stochastic Sans. font/iosevka.py copies it into the Iosevka checkout.
# Anatomy: double-storey a with flat bottoms on a b d u and capital U G, flat L-turn hooks on t, f, j and g (t, f and j are cut to the length of l's tail by font/hooks.py); the rule is flat at the baseline, eared at the x-height, with r as the one terminal exception,
# single-storey g, flat-top r (the sans arm is cut by font/hooks.py), straight y, slashed zero, serifed capital I, short-tailed l.
# Metrics: a tall x-height (504) and cap height 690 for long prose, wide letter bodies
# (cell 530, sidebearings x0.7). Advances are replaced by font/spacing.py, so only the bodies matter.

[buildPlans.IosevkaStochastic]
family = "Iosevka Stochastic"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true

[buildPlans.IosevkaStochastic.variants.design]
a = "double-storey-flat-bottom-serifless"
b = "flat-bottom-serifless"
d = "flat-bottom-serifless"
u = "flat-bottom-serifless"
f = "flat-hook-serifless-crossbar-at-x-height"
t = "flat-hook"
g = "single-storey-flat-hook-serifless"
y = "straight-serifless"
i = "serifless"
j = "flat-hook-serifless"
l = "semi-tailed"
r = "flat-top-serifless"
capital-i = "serifed"
capital-u = "flat-bottom-serifless"
capital-g = "flat-bottom-serifless-hooked"
zero = "slashed"
one = "base"
e = "flat-crossbar"

[buildPlans.IosevkaStochastic.weights.Regular]
shape = 378
menu = 400
css = 400

[buildPlans.IosevkaStochastic.weights.Bold]
shape = 735
menu = 700
css = 700

[buildPlans.IosevkaStochastic.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaStochastic.widths.Normal]
shape = 530
menu = 5
css = "normal"

[buildPlans.IosevkaStochastic.metricOverride]
cap = 690
ascender = 715
xHeight = 504
sb = 'default_sb * 0.7'
leading = 1200


# Monospace sibling. Same variants and metrics; fixed 550-unit cell, default sidebearings.
# "term" spacing keeps every glyph inside one cell, so em dashes, arrows and ellipses
# (the characters LLM text leans on) do not break alignment in code blocks and tables.
# Keep the variants in sync with the plan above.

[buildPlans.IosevkaStochasticMono]
family = "Iosevka Stochastic Mono"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true

[buildPlans.IosevkaStochasticMono.variants.design]
a = "double-storey-flat-bottom-serifless"
b = "flat-bottom-serifless"
d = "flat-bottom-serifless"
u = "flat-bottom-serifless"
f = "flat-hook-serifless-crossbar-at-x-height"
t = "flat-hook"
g = "single-storey-flat-hook-serifless"
y = "straight-serifless"
i = "serifed"
j = "flat-hook-serifed"
l = "serifed-flat-tailed"
r = "flat-top-serifless"
capital-i = "serifed"
capital-u = "flat-bottom-serifless"
capital-g = "flat-bottom-serifless-hooked"
zero = "slashed"
one = "base"
e = "flat-crossbar"
capital-w = "straight-flat-top-serifless"
w = "straight-flat-top-serifless"

[buildPlans.IosevkaStochasticMono.weights.Regular]
shape = 378
menu = 400
css = 400

[buildPlans.IosevkaStochasticMono.weights.Bold]
shape = 735
menu = 700
css = 700

[buildPlans.IosevkaStochasticMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaStochasticMono.widths.Normal]
shape = 550
menu = 5
css = "normal"

[buildPlans.IosevkaStochasticMono.metricOverride]
cap = 690
ascender = 715
xHeight = 504
leading = 1200
