# Build plan for the Iosevka base of Stochastic Sans. font/iosevka.py copies it into the Iosevka checkout.
# Anatomy: single-storey a and g, straight y, slashed zero, serifed capital I.
# Metrics: a tall x-height (504) and cap height 690 for long prose, wide letter bodies
# (cell 530, sidebearings x0.7). Advances are replaced by font/spacing.py, so only the bodies matter.

[buildPlans.IosevkaStochastic]
family = "Iosevka Stochastic"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true

[buildPlans.IosevkaStochastic.variants.design]
a = "single-storey-tailed"
g = "single-storey-serifless"
y = "straight-serifless"
i = "serifless"
j = "serifless"
l = "serifless"
capital-i = "serifed"
zero = "slashed"
one = "base"
e = "flat-crossbar"

[buildPlans.IosevkaStochastic.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaStochastic.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaStochastic.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaStochastic.widths.Normal]
shape = 530
menu = 5
css = "normal"

[buildPlans.IosevkaStochastic.metricOverride]
cap = 690
ascender = 715
xHeight = 504
sb = 'default_sb * 0.7'
leading = 1200


# Monospace sibling. Same variants and metrics; fixed 580-unit cell, default sidebearings.
# "term" spacing keeps every glyph inside one cell, so em dashes, arrows and ellipses
# (the characters LLM text leans on) do not break alignment in code blocks and tables.
# Keep the variants in sync with the plan above.

[buildPlans.IosevkaStochasticMono]
family = "Iosevka Stochastic Mono"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true

[buildPlans.IosevkaStochasticMono.variants.design]
a = "single-storey-tailed"
g = "single-storey-serifless"
y = "straight-serifless"
i = "serifless"
j = "serifless"
l = "serifless"
capital-i = "serifed"
zero = "slashed"
one = "base"
e = "flat-crossbar"
capital-w = "straight-flat-top-serifless"
w = "straight-flat-top-serifless"

[buildPlans.IosevkaStochasticMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaStochasticMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaStochasticMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaStochasticMono.widths.Normal]
shape = 550
menu = 5
css = "normal"

[buildPlans.IosevkaStochasticMono.metricOverride]
cap = 690
ascender = 715
xHeight = 504
leading = 1200
